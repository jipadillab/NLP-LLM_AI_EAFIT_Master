# ============================================================
# Config de Streamlit — EAFIT NLP & LLM Interactive Lab
# ============================================================
# Con torch/torchvision/transformers fuera del proyecto, el problema
# del file-watcher ya no debería dispararse. Se deja fileWatcherType
# en "auto" (el valor por defecto de Streamlit) para conservar el
# autoreload normal durante el desarrollo. Si algún día vuelves a
# agregar una librería pesada tipo transformers y ves de nuevo el
# error de torchvision en los logs, cambia la línea de abajo a:
#   fileWatcherType = "none"
[server]
runOnSave = true

[theme]
base = "dark"
primaryColor = "#f0883e"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
font = "sans serif"
