# ============================================================
# Config de Streamlit — evita el ruido/crash aparente causado por
# el file-watcher de Streamlit al introspeccionar los cientos de
# submódulos "lazy" de `transformers` (incluye modelos de visión
# como ViTMatte, ViTPose, YOLOS, ZoeDepth que requieren torchvision,
# aunque este lab solo usa los modelos de TEXTO de transformers).
#
# Sin esto, cada rerun del watcher intenta importar esos submódulos
# de visión y torchvision lanza ModuleNotFoundError repetidamente
# en los logs — no rompe la app, pero ensucia el log y ralentiza
# los arranques en frío.
# ============================================================
[server]
fileWatcherType = "none"
runOnSave = false

[theme]
base = "dark"
primaryColor = "#f0883e"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
font = "sans serif"
